name: Fetch Latest Videos

on:
  schedule:
    # Run daily at 09:00 UTC — after the YouTube quota resets at midnight Pacific (~08:00 UTC)
    - cron: '0 9 * * *'
  workflow_dispatch:

concurrency:
  group: youtube-fetch-videos
  cancel-in-progress: false

jobs:
  fetch-videos:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write  # Required for OIDC authentication

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Fetch videos from YouTube API
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          REFRESH_EXISTING: "false"
          MIN_SYNC_INTERVAL_HOURS: "20"
        run: node scripts/fetch-videos.js

      - name: Update playlists
        run: node scripts/update-playlists.js

      - name: Check for changes
        id: check-changes
        run: |
          echo "🔍 Checking for changes in videos and stats..."
          echo "📁 Videos directory contents:"
          ls -la src/content/videos/ || echo "Directory not found or empty"

          # Check if there are any new or modified files in the videos directory or stats.json
          if git status --porcelain src/content/videos/ src/content/stats.json src/content/playlists/ | grep -q .; then
            echo "📝 Found changes in videos, stats, or playlists"
            git status --porcelain src/content/videos/ src/content/stats.json src/content/playlists/
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "📭 No changes in videos, stats, or playlists"
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit changes
        if: steps.check-changes.outputs.changed == 'true'
        run: |
          echo "💾 Committing changes..."
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          echo "📋 Files to be committed:"
          git add src/content/videos/ src/content/stats.json src/content/playlists/
          git status --porcelain
          git commit -m "chore: update videos, channel stats, and playlists from YouTube API"
          echo "🚀 Pulling remote changes and pushing..."
          git pull --rebase
          git push
          echo "✅ Changes committed and pushed successfully"

      - name: Trigger deploy
        if: steps.check-changes.outputs.changed == 'true'
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
            -d '{"event_type":"content-updated"}'
