name: Refresh Videos Monthly

on:
  schedule:
    # Run on the first Monday of each month at 10:00 UTC (after quota reset, avoids daily overlap)
    - cron: '0 10 1-7 * 1'
  workflow_dispatch:

concurrency:
  group: youtube-fetch-videos
  cancel-in-progress: false

jobs:
  refresh-videos:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write  # Required for OIDC authentication

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Refresh videos from YouTube API (full refresh)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          REFRESH_EXISTING: "true"
          FORCE_SYNC: "true"
          MIN_SYNC_INTERVAL_HOURS: "0"
        run: node scripts/fetch-videos.js

      - name: Update playlists
        run: node scripts/update-playlists.js

      - name: Check for changes
        id: check-changes
        run: |
          echo "🔍 Checking for video file changes..."
          echo "📁 Videos directory contents:"
          ls -la src/content/videos/ || echo "Directory not found or empty"

          if git status --porcelain src/content/videos/ src/content/stats.json src/content/playlists/ | grep -q .; then
            echo "📝 Found changes in videos, stats, or playlists"
            git status --porcelain src/content/videos/ src/content/stats.json src/content/playlists/
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "📭 No changes in videos, stats, or playlists"
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit changes
        if: steps.check-changes.outputs.changed == 'true'
        run: |
          echo "💾 Committing video changes..."
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          echo "📋 Files to be committed:"
          git add src/content/videos/ src/content/stats.json src/content/playlists/
          git status --porcelain
          git commit -m "chore: monthly refresh videos and playlists from YouTube API"
          echo "🚀 Pulling remote changes and pushing..."
          git stash --include-untracked
          git pull --rebase
          git stash pop || true
          git push
          echo "✅ Changes committed and pushed successfully"

      - name: Trigger deploy
        if: steps.check-changes.outputs.changed == 'true'
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
            -d '{"event_type":"content-updated"}'