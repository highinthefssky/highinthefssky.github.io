name = "highinthesky-live-status"
main = "worker.js"
compatibility_date = "2024-01-01"

# Environment variables are set in the Cloudflare Dashboard
# Do NOT add secrets here - use `wrangler secret put` or the dashboard

[vars]
ALLOWED_ORIGIN = "https://highintheflightsimsky.nl"
# Set to "true" only for development - allows localhost CORS
ALLOW_LOCALHOST = "false"

# KV namespace for caching live status (reduces YouTube API quota usage)
# Create via: wrangler kv namespace create "LIVE_STATUS_CACHE"
# Then replace the id below with the one returned by the command.
[[kv_namespaces]]
binding = "LIVE_STATUS_CACHE"
id = "3762f5f3b6fc4c7d923f5dc93ef6ba2e"

# The following secret must be set via Cloudflare Dashboard or wrangler CLI:
# - YOUTUBE_CHANNEL_ID
#
# Note: YOUTUBE_API_KEY is NO LONGER required for this worker.
# Live detection now uses the channel's /live page (zero API quota).
# If you previously set YOUTUBE_API_KEY as a secret, you can safely remove it.
