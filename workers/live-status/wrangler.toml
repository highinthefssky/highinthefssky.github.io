name = "highinthesky-live-status"
main = "worker.js"
compatibility_date = "2024-01-01"

# Environment variables are set in the Cloudflare Dashboard
# Do NOT add secrets here - use `wrangler secret put` or the dashboard

[vars]
ALLOWED_ORIGIN = "https://highintheflightsimsky.nl"
# Set to "true" only for development - allows localhost CORS
ALLOW_LOCALHOST = "false"
YOUTUBE_CHANNEL_ID = "UCyyc5Gnzs5sxgvOmJ96Rfqw"

[[durable_objects.bindings]]
name = "LIVE_STATUS_COORDINATOR"
class_name = "LiveStatusCoordinator"

[[migrations]]
tag = "v1-live-status-coordinator"
new_sqlite_classes = ["LiveStatusCoordinator"]

# Required secret: YOUTUBE_API_KEY
# Configure with: wrangler secret put YOUTUBE_API_KEY
